# 生产：公网只提供 HTTPS。证书为 Let’s Encrypt IP 证书（约 6 天，certbot 自动续期）。
# 正式访问：https://47.117.113.28/shxby/
# 80 仅保留 ACME 校验，其余 301 到 HTTPS。

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name 47.117.113.28;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/acme;
        default_type text/plain;
    }

    location / {
        return 301 https://47.117.113.28$request_uri;
    }
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    http2 on;
    server_name 47.117.113.28;

    ssl_certificate     /etc/letsencrypt/live/ip-47-117-113-28/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ip-47-117-113-28/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_timeout 1d;
    ssl_session_cache   shared:SSL:10m;

    client_max_body_size 20m;
    root /opt/xby-admin/html;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml image/svg+xml;

    location = / {
        return 302 /shxby/;
    }

    # AI 成文（含 /start、/jobs/*/stream SSE 打字机）：关缓冲 + 长超时，否则公网 Network Error / 504
    location ^~ /shxby/api/geo/content-placement/articles/ai-generate {
        proxy_pass http://127.0.0.1:8080/api/geo/content-placement/articles/ai-generate;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;
        gzip off;
        add_header X-Accel-Buffering no always;
        proxy_connect_timeout 60s;
        proxy_send_timeout 1800s;
        proxy_read_timeout 1800s;
    }

    location /shxby/api/ {
        proxy_pass http://127.0.0.1:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    location /shxby/assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
        try_files $uri =404;
    }

    location ^~ /shxby/lakex/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
        try_files $uri =404;
    }

    location = /shxby/index.html {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location /shxby/ {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /shxby/index.html;
    }
}
