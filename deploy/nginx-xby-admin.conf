# IP 直连 + 域名子路径共用
# 正式访问：https://www.nadaer.net/shxby/
# IP 临时：http://ECS_IP/shxby/

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name www.nadaer.net nadaer.net _;

    client_max_body_size 20m;
    root /opt/xby-admin/html;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml image/svg+xml;

    # 根路径跳到子应用
    location = / {
        return 302 /shxby/;
    }

    # API：/shxby/api/* -> 后端 /api/*
    location /shxby/api/ {
        proxy_pass http://127.0.0.1:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_read_timeout 120s;
    }

    # 带 hash 的构建产物：长期缓存，未改动的路由/vendor 包不会再下载
    location /shxby/assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
        try_files $uri =404;
    }

    # HTML 入口始终回源，用来发现新的 chunk 文件名
    location = /shxby/index.html {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # 前端静态资源 + SPA
    location /shxby/ {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /shxby/index.html;
    }
}
