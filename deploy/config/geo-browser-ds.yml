# 测试机外置配置片段：只覆盖 DS 登录页选择器。
# 放到 /opt/xby-admin/config/application-test.yml（目录为空时）。不要写入密码。
geo:
  auto-monitor:
    browser:
      profiles:
        - name: DS
          login-url: https://chat.deepseek.com/sign_in
          login-entry-selectors:
            - "[data-geo-no-login-entry='1']"
          login-tab-selector: "text=/密码登录|Login with password/ >> visible=true"
          login-account-selector: "input[placeholder*='手机'], input[placeholder*='Phone'], input[type='tel']"
          login-password-selector: "input[type='password']"
          login-submit-selectors:
            - "button[type='submit']"
            - "text=/^登录$/"
          login-success-selector: "textarea, [contenteditable='true']"
          login-captcha-selectors:
            - "iframe[src*='captcha']"
            - "text=/请完成安全验证|拖动滑块|人机验证/"
