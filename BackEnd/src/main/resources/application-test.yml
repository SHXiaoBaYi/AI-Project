# 测试 ECS（121.40.170.82）：测试 RDS 内网
# RDS 主机沿用 application.yml 默认（rm-bp15f2a3k5b93293k）
spring:
  datasource:
    url: jdbc:mysql://${xby.rds.internal-host}:${xby.rds.port}/${xby.rds.database}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${xby.rds.username}
    password: ${xby.rds.password}
    driver-class-name: com.mysql.cj.jdbc.Driver

xby:
  upload-public-base: ${UPLOAD_PUBLIC_BASE:http://121.40.170.82/shxby/api}
  # 测试 ECS 允许账号密码登录（生产仍仅钉钉）
  auth:
    password-login-enabled: true

# 测试环境保留 Swagger，便于联调
springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
