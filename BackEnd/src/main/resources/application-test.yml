# 测试 ECS（47.117.132.161）：测试 RDS 内网
# RDS 主机沿用 application.yml 默认（rm-uf64y725h1ufca0jk）
spring:
  datasource:
    url: jdbc:mysql://${xby.rds.internal-host}:${xby.rds.port}/${xby.rds.database}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${xby.rds.username}
    password: ${xby.rds.password}
    driver-class-name: com.mysql.cj.jdbc.Driver

xby:
  upload-public-base: ${UPLOAD_PUBLIC_BASE:http://47.117.132.161/shxby/api}
  # 测试 ECS 允许账号密码登录（生产仍仅钉钉）
  auth:
    password-login-enabled: true
  # 顶部「同步生产数据 / 同步表结构到生产」；生产库走外网地址
  env-sync:
    enabled: true
    prod:
      host: rm-uf6l17zg54sh9378vso.mysql.rds.aliyuncs.com
      port: 3306
      database: base_admin
      username: ${RDS_USERNAME:xiaobayi0099}
      password: ${RDS_PASSWORD:Xby@123456}

# 与生产共用同一机器人凭证时，测试默认不占 Stream，避免「线上邀约」卡片落到 47.117.132.161
dingtalk:
  h5-base-url: ${DINGTALK_H5_BASE_URL:http://47.117.132.161/shxby}
  robot:
    stream-enabled: ${DINGTALK_ROBOT_STREAM_ENABLED:false}

# 测试环境保留 Swagger，便于联调
springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
