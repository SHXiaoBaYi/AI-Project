# 本机开发：浏览器访问 localhost / 127.0.0.1 时使用
# 连接阿里云 RDS 外网地址（本机无法访问 VPC 内网）
spring:
  datasource:
    url: jdbc:mysql://${xby.rds.external-host}:${xby.rds.port}/${xby.rds.database}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=true&allowPublicKeyRetrieval=true
    username: ${xby.rds.username}
    password: ${xby.rds.password}
    driver-class-name: com.mysql.cj.jdbc.Driver
