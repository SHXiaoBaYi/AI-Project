# 本机开发：浏览器访问 localhost / 127.0.0.1
# 连接「测试」RDS 外网（application.yml 默认 rm-bp15f2a3k5b93293kso）
#
# 前端本地开发默认把 /api 与附件代理到测试 ECS：
#   http://121.40.170.82/shxby
# 仅调试本机后端时：FrontEnd 设 VITE_API_PROXY_TARGET=http://127.0.0.1:8080
spring:
  datasource:
    url: jdbc:mysql://${xby.rds.external-host}:${xby.rds.port}/${xby.rds.database}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=true&allowPublicKeyRetrieval=true
    username: ${xby.rds.username}
    password: ${xby.rds.password}
    driver-class-name: com.mysql.cj.jdbc.Driver

# 本机后端若仍启动，附件目录固定（仅在不走测试代理时用到）
xby:
  upload-dir: ${UPLOAD_DIR:D:/AI-XBY/AI-Project/BackEnd/uploads}
  upload-public-base: ${UPLOAD_PUBLIC_BASE:http://121.40.170.82/shxby/api}

# 钉钉机器人联调（ActionCard → H5）：
# 王方扬在「钉钉应用配置」可选本机/线上；其他人固定线上。
# 本机 H5 默认如下（桌面钉钉可开 127.0.0.1:3000；手机需局域网 IP）
dingtalk:
  local-h5-base-url: ${DINGTALK_LOCAL_H5_BASE_URL:http://127.0.0.1:3000}

