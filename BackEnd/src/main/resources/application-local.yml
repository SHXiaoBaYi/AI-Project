# 本机开发：只连「测试」库，永不连生产。
#
# 测试 RDS 外网 DNS 未开通时，必须先开 SSH 隧道再启后端：
#   .\deploy\tunnel-test-rds.ps1
# 隧道：本机 13306 → 测试 ECS → 测试 RDS 内网
#
# 日常只改前端时：不必起本机后端；Vite 默认代理到测试 ECS（121.40.170.82）。
# 仅调试本机后端时：FrontEnd 设 VITE_API_PROXY_TARGET=http://127.0.0.1:8080
spring:
  datasource:
    url: jdbc:mysql://127.0.0.1:13306/base_admin?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${xby.rds.username}
    password: ${xby.rds.password}
    driver-class-name: com.mysql.cj.jdbc.Driver

xby:
  # 显式钉死测试实例标记（供日志/校验；本机实际连 127.0.0.1 隧道）
  rds:
    external-host: rm-bp15f2a3k5b93293kso.mysql.rds.aliyuncs.com
    internal-host: rm-bp15f2a3k5b93293k.mysql.rds.aliyuncs.com
  upload-dir: ${UPLOAD_DIR:D:/AI-XBY/AI-Project/BackEnd/uploads}
  upload-public-base: ${UPLOAD_PUBLIC_BASE:http://121.40.170.82/shxby/api}
  auth:
    password-login-enabled: true
  # 同步按钮只在测试 ECS（profile=test）开放，本机关闭
  env-sync:
    enabled: false

dingtalk:
  local-h5-base-url: ${DINGTALK_LOCAL_H5_BASE_URL:http://127.0.0.1:3000}
