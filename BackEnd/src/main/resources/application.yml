server:
  port: 8080
  servlet:
    context-path: /api

spring:
  # local/dev：本机开发（浏览器访问 localhost）→ RDS 外网
  # prod：ECS 等同 VPC 部署 → RDS 内网
  profiles:
    active: local
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
    serialization:
      write-dates-as-timestamps: false
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

# RDS 地址统一管理：按 profile 选择外网/内网
xby:
  rds:
    external-host: rm-bp18jx12jxs1884h9so.mysql.rds.aliyuncs.com
    internal-host: rm-bp18jx12jxs1884h9.mysql.rds.aliyuncs.com
    port: 3306
    database: base_admin
    username: ${RDS_USERNAME:xiaobayi0099}
    password: ${RDS_PASSWORD:Xby@123456}
  upload-dir: ${UPLOAD_DIR:./uploads}

mybatis-plus:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.base.admin.domain.entity
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: isActive
      logic-not-delete-value: 1
      logic-delete-value: 0
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha

jwt:
  secret: YmFzZS1hZG1pbi1zZWNyZXQta2V5LW11c3QtYmUtYXQtbGVhc3QtMjU2LWJpdHMtbG9uZw==
  expiration: 86400000

geo:
  seed: false
  board-persist:
    enabled: true
    # 本地启动时立即跑一轮，便于马上看到「已统计」效果
    on-startup: true
    lookback-weeks: 26
    lookback-months: 12
    lookback-years: 2
    # 每周一 02:00 固化已结束的周
    weekly-cron: "0 0 2 ? * MON"
    # 每月 1 日 02:10 固化已结束的月
    monthly-cron: "0 10 2 1 * ?"
    # 每年 1 月 1 日 02:20 固化已结束的年/目标区间
    yearly-cron: "0 20 2 1 1 ?"
