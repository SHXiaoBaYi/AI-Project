server:
  port: 8080
  servlet:
    context-path: /api

spring:
  # local/dev：本机开发（浏览器访问 localhost）→ RDS 外网
  # prod：ECS 等同 VPC 部署 → RDS 内网
  profiles:
    active: local
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
    serialization:
      write-dates-as-timestamps: false
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

# RDS 地址统一管理：按 profile 选择外网/内网
xby:
  rds:
    external-host: rm-bp18jx12jxs1884h9so.mysql.rds.aliyuncs.com
    internal-host: rm-bp18jx12jxs1884h9.mysql.rds.aliyuncs.com
    port: 3306
    database: base_admin
    username: ${RDS_USERNAME:xiaobayi0099}
    password: ${RDS_PASSWORD:Xby@123456}
  upload-dir: ${UPLOAD_DIR:./uploads}
  # 附件对外访问根（含 /api）。落库仍用 /uploads/...，接口返回时拼成公网地址
  upload-public-base: ${UPLOAD_PUBLIC_BASE:http://121.40.119.134/shxby/api}
  # 通用 AI（OpenAI 兼容）。未启用或未配 key 时，相似问题走本地启发式
  # provider: deepseek | tongyi | zhipu | moonshot
  # 你有阿里云账号时优先试 tongyi（DashScope 兼容模式）
  ai:
    enabled: ${XBY_AI_ENABLED:false}
    provider: ${XBY_AI_PROVIDER:tongyi}
    # 通用 key；也可按厂商单独配下面几个
    api-key: ${XBY_AI_API_KEY:}
    deepseek-api-key: ${DEEPSEEK_API_KEY:}
    tongyi-api-key: ${TONGYI_API_KEY:}
    zhipu-api-key: ${ZHIPU_API_KEY:}
    moonshot-api-key: ${MOONSHOT_API_KEY:}
    # 一般不用改；改了会覆盖厂商预设
    base-url: ${XBY_AI_BASE_URL:}
    model: ${XBY_AI_MODEL:}
    timeout-seconds: ${XBY_AI_TIMEOUT_SECONDS:60}

mybatis-plus:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.base.admin.domain.entity
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: isActive
      logic-not-delete-value: 1
      logic-delete-value: 0
  configuration:
    map-underscore-to-camel-case: true
    # 演示数据刷库时 StdOutImpl 会堵住控制台管道；改用 slf4j，量级由 logging 级别控制
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha

jwt:
  secret: YmFzZS1hZG1pbi1zZWNyZXQta2V5LW11c3QtYmUtYXQtbGVhc3QtMjU2LWJpdHMtbG9uZw==
  # 登录有效期 12 小时（毫秒）；超时后 JWT 与在线会话同时失效，需重新扫码登录
  expiration: 43200000

geo:
  seed: false
  board-persist:
    enabled: true
    on-startup: false
    lookback-weeks: 26
    lookback-months: 12
    lookback-years: 2
    # 每周一 02:00 固化已结束的周
    weekly-cron: "0 0 2 ? * MON"
    # 每月 1 日 02:10 固化已结束的月
    monthly-cron: "0 10 2 1 * ?"
    # 每年 1 月 1 日 02:20 固化已结束的年/目标区间
    yearly-cron: "0 20 2 1 1 ?"
    # 每周一 02:15 固化内容投放周报
    content-weekly-cron: "0 15 2 ? * MON"
    # 每月 1 日 02:25 固化内容投放月报
    content-monthly-cron: "0 25 2 1 * ?"

dingtalk:
  # 页面「系统管理 → 钉钉应用配置」优先。这里仅在库里没有启用配置时作备用。
  enabled: ${DINGTALK_ENABLED:false}
  client-id: ${DINGTALK_CLIENT_ID:}
  client-secret: ${DINGTALK_CLIENT_SECRET:}

# 演示数据已清空。保持 false，避免启动时再把测试数据刷回去。
demo:
  seed: false
  # true=启动时清空旧演示数据后重刷；日常保持 false
  reseed: false
  # true=仅按现有日监测重建周/月/年快照并对齐校验；刷完改回 false
  rebuild-board: false
